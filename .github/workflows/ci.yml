name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Dart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Release-')
        shell: pwsh
        run: |
          $releaseTag = $env:GITHUB_REF_NAME
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)\s*$'
          $packageVersion = $versionLine.Matches.Groups[1].Value
          if ($releaseTag -cnotmatch '^Release-[0-9]+\.[0-9]+\.[0-9]+$' -or
              $releaseTag -cne "Release-$packageVersion") {
            throw "Release tag '$releaseTag' must be Release-x.x.x and match pubspec.yaml version '$packageVersion'."
          }

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

  publish:
    name: Publish to pub.dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Release-')
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
